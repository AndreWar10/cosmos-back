# https://render.com — Web Service
services:
  - type: web
    name: cosmos-back
    runtime: node
    # Starter (~$7/mo): always-on, no spin-down after idle
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NASA_API_KEY
        sync: false
      - key: CORS_ORIGIN
        value: "*"
