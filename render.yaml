# https://render.com — Web Service
services:
  - type: web
    name: cosmos-back
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NASA_API_KEY
        sync: false
      - key: CORS_ORIGIN
        value: "*"
